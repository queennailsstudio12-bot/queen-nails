<body>
  <header class="bar">
    <a class="brand" href="./" aria-label="Queen Nails Studio, inicio"><img src="assets/logo.jpg" alt="" width="44" height="44"><span>Queen Nails<small>STUDIO · BY SOFÍA</small></span></a>
    <a class="bar-link" id="mis-citas-link" href="#reserva" hidden>Mi cita</a>

  <!-- Vista "Mi cita" (enlace personal ?t=…) -->
  <section id="mi-cita" class="manage-wrap" hidden aria-live="polite"></section>

  <main id="reserva" class="book-wrap">

      <div class="card-head"><h1>Reserva tu cita</h1><p class="tagline">Tus uñas merecen sentirse como una reina ✨</p></div>
      <div id="aviso" class="notice" hidden></div>
      <div id="mis-citas" hidden></div>
      <div id="booking-app"><p class="muted">Cargando agenda…</p></div>
    </div>

    <section class="info" aria-label="Información del estudio">
      <div><span aria-hidden="true">📍</span><p><b id="tip-dir">Alfonso López, Usme – Bogotá D. C.</b></p></div>
      <div><span aria-hidden="true">🕘</span><ul class="hours" id="hours"></ul></div>
      <div><span aria-hidden="true">💬</span><p>¿Dudas? <a id="foot-wa" href="#" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p></div>
    </section>
  </main>

  <footer>© <span id="year"></span> Queen Nails Studio · by Sofía</footer>
